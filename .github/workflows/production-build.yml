name: Production Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Astro production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository currently has no committed npm lockfile, so npm install
      # is used instead of npm ci. Once a lockfile is intentionally added,
      # this can be changed back to npm ci for fully locked dependency installs.
      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: npm run build
